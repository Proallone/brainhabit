services:
  postgres:
    container_name: bh_pg
    image: postgres:latest
    ports:
      - 5432:5432
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s 
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - fullstack

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bh_pgadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
    volumes:
      - pgadmin_volume:/var/lib/pgadmin
    networks:
      - fullstack
  bh:
    image: bh:0.1
    container_name: bh_backend
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      -  ${PORT}:${PORT}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - CONNECTION_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    volumes:
      - api_volume:/usr/src/app/
    depends_on:
      - postgres
    networks:
      - fullstack
volumes:
  postgres_volume:
    driver: local
  api_volume:
  pgadmin_volume:

networks:
  fullstack:
    driver: bridge
